name: Joy
description: Joy (withjoy.com) is a consumer wedding and event planning platform that
  gives couples a free personalized wedding website, an all-in-one universal registry,
  guest list management, digital and printed save-the-dates and invitations, smart
  RSVP tools, hotel room blocks, and a companion mobile app. The company has since
  expanded into baby planning with Joy Baby. Joy is a business-to-consumer product
  and does not publish a public developer API, developer portal, SDKs, or OpenAPI
  specification; this profile therefore carries identity and link-property metadata
  and live security probes rather than machine-readable API artifacts.
